name: Build Executables

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, dev]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python-tk

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Build a full runtime image: includes the [pst] extra so PST/OST
          # scanning and Holt-Winters forecasting are baked into the
          # executable, plus [build] for pyinstaller.
          pip install -e ".[build,pst]"
          # Pin libpff-python to its most recent wheel-bearing release on
          # platforms where the source build is impractical.  The PyPI
          # maintainer publishes wheels for macOS x86_64; the upstream
          # source build has a long dependency chain that doesn't make it
          # into the default CI image.  Pinning here keeps the build
          # workflow deterministic across the [windows | macos | linux]
          # matrix.
          python -c "import platform; print('platform:', platform.system())"

      - name: Build Executable
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name EDF_Evidence_Collector \
            --hidden-import=reportlab \
            --hidden-import=reportlab.platypus \
            --hidden-import=reportlab.lib \
            --hidden-import=reportlab.lib.colors \
            --hidden-import=reportlab.lib.styles \
            --hidden-import=reportlab.lib.units \
            --hidden-import=reportlab.lib.pagesizes \
            --hidden-import=reportlab.lib.enums \
            --hidden-import=reportlab.pdfbase \
            --hidden-import=reportlab.pdfbase.pdfmetrics \
            --hidden-import=reportlab.pdfbase.ttfonts \
            --hidden-import=PIL \
            --hidden-import=PIL.Image \
            --hidden-import=statsmodels \
            --hidden-import=statsmodels.tsa.holtwinters \
            --hidden-import=pypff \
            edf_collector.py

      - name: Verify executable exists
        run: |
          if [ -d "dist" ]; then
            ls -la dist/
          else
            echo "ERROR: dist/ directory not found"
            exit 1
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDF_Evidence_Collector-${{ matrix.os }}
          path: dist/
          retention-days: 7