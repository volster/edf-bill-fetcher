name: Build Executables

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [how-its-going]

permissions:
  contents: read

concurrency:
  group: builds-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt

      - name: Record Python runtime
        run: python ci_runtime.py --inventory --report .ci-diagnostics/python.json

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # tkinter for the GUI; python3-dev so libpff-python can
          # source-build against system Python headers; autotools
          # so the source build itself can run.
          sudo apt-get install -y python3-tk tk-dev python3-dev tesseract-ocr tesseract-ocr-eng
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 xvfb

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract

      - name: Install OCR engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Tesseract installation failed" }

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps already include libpff-python and statsmodels
          # (see pyproject.toml), so the binary ships with PST scanning
          # and Holt-Winters forecasting built-in.  Build extra adds
          # PyInstaller on top.
          python -m pip install -c .github/ci-constraints.txt -e ".[build,msg]"
          python -m pip freeze --all > .ci-diagnostics/dependencies.txt

      - name: Check GUI runtimes (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python ci_runtime.py

      - name: Check GUI runtimes (Windows / macOS)
        if: runner.os != 'Linux'
        run: python ci_runtime.py

      - name: Build Executable
        shell: bash
        run: |
          # Hidden imports — each line below is a module the source
          # code loads dynamically (via ``find_spec`` / ``importlib``)
          # that PyInstaller's static analysis can't follow.  Every
          # entry here corresponds to a runtime dep declared in
          # ``pyproject.toml[project].dependencies``; we add it here
          # purely so PyInstaller bundles the binary into the exe.
          #
          # Crashes caused by a missing module show up at exe runtime
          # as ``ImportError: No module named 'X'`` — pinning these
          # with ``--hidden-import`` is the standard PyInstaller
          # workaround (see scikit-build / pandas' own bundling docs).
          #
          # NOTE: bash's ``\`` line-continuation does NOT accept ``#``
          # comments on the joined lines — the inline-comment
          # style the previous draft of this step used (mid-command
          # ``# === Direct deps: reportlab ===`` etc.) caused the
          # GitHub Actions runner to treat each comment as a fresh
          # shell command (``--hidden-import=reportlab: command
          # not found``), which propagates onward as
          # ``pyinstaller: error: the following arguments are
          # required: scriptname``.  All rationale lives in this
          # header block; the actual pyinstaller command is a clean
          # uninterrupted chain of ``\` joins.
          python -m PyInstaller --onefile --windowed --name EDF_Evidence_Collector \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --hidden-import=pypdfium2 \
            --additional-hooks-dir=.github/pyinstaller_hooks \
            --hidden-import=reportlab \
            --hidden-import=reportlab.platypus \
            --hidden-import=reportlab.lib \
            --hidden-import=reportlab.lib.colors \
            --hidden-import=reportlab.lib.styles \
            --hidden-import=reportlab.lib.units \
            --hidden-import=reportlab.lib.pagesizes \
            --hidden-import=reportlab.lib.enums \
            --hidden-import=reportlab.pdfbase \
            --hidden-import=reportlab.pdfbase.pdfmetrics \
            --hidden-import=reportlab.pdfbase.ttfonts \
            --hidden-import=scipy \
            --hidden-import=scipy.stats \
            --hidden-import=statsmodels \
            --hidden-import=statsmodels.tsa.holtwinters \
            --hidden-import=pypff \
            --collect-all extract_msg \
            --collect-data edf_bill_fetcher \
            --copy-metadata=edf-bill-fetcher \
            main.py

      - name: Code-sign macOS bundle (ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Ad-hoc signing (sign with `-` identity = no developer cert).
          # This won't pass Gatekeeper's notarization check. Users who
          # download the artifact will need
          # to `xattr -cr EDF_Evidence_Collector.app` to clear the
          # quarantine flag before running.
          #
          # --deep is deprecated since macOS 11 and can corrupt nested
          # framework signatures, so sign the inner binary first, then
          # the outer .app.
          if [ -d "dist/EDF_Evidence_Collector.app" ]; then
            codesign --force --sign - dist/EDF_Evidence_Collector.app/Contents/MacOS/EDF_Evidence_Collector || true
            codesign --force --sign - dist/EDF_Evidence_Collector.app || true
            echo "Ad-hoc signed dist/EDF_Evidence_Collector.app"
          elif [ -f "dist/EDF_Evidence_Collector" ]; then
            codesign --force --sign - dist/EDF_Evidence_Collector
            echo "Ad-hoc signed dist/EDF_Evidence_Collector (single binary)"
          else
            echo "WARNING: No executable found to sign"
          fi

      - name: Verify macOS code signature (ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "dist/EDF_Evidence_Collector.app" ]; then
            codesign --verify --verbose=4 dist/EDF_Evidence_Collector.app
            echo "Signature verification passed for dist/EDF_Evidence_Collector.app"
          elif [ -f "dist/EDF_Evidence_Collector" ]; then
            codesign --verify --verbose=4 dist/EDF_Evidence_Collector
            echo "Signature verification passed for dist/EDF_Evidence_Collector (single binary)"
          else
            echo "WARNING: No signed executable found to verify"
          fi

      - name: Verify bundled OCR and Excel corrections on an image-only bill
        run: python .github/scripts/check_frozen_ocr.py

      - name: Record build dependencies
        shell: bash
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUILD_VALIDATION: ${{ github.event_name == 'workflow_run' && 'required-ci-passed' || 'manual-unvalidated' }}
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          python -m pip freeze --all > dist/build-dependencies.txt
          python -c 'import json, os; json.dump({"sha": os.environ["BUILD_SHA"], "validation": os.environ["BUILD_VALIDATION"]}, open("dist/build-provenance.json", "w"))'

      - name: Verify executable exists
        run: |
          if [ -d "dist" ]; then
            ls -la dist/
          else
            echo "ERROR: dist/ directory not found"
            exit 1
          fi
        shell: bash

      - name: Package and verify macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Artifact uploads do not preserve symlink metadata. Store the
          # signed app inside a zip that retains its framework symlinks.
          zip -q -r -y EDF_Evidence_Collector-macos.zip dist/
          archive_check="$(mktemp -d)"
          trap 'rm -rf "$archive_check"' EXIT
          unzip -q EDF_Evidence_Collector-macos.zip -d "$archive_check"
          codesign --verify --verbose=4 "$archive_check/dist/EDF_Evidence_Collector.app"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .ci-diagnostics/
            build/EDF_Evidence_Collector/warn-*.txt
            build/EDF_Evidence_Collector/xref-*.html
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: EDF_Evidence_Collector-${{ matrix.os }}-${{ github.event_name == 'workflow_dispatch' && 'manual-unvalidated' || 'ci-validated' }}
          path: ${{ runner.os == 'macOS' && 'EDF_Evidence_Collector-macos.zip' || 'dist/' }}
          retention-days: 7
