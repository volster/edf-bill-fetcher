name: Build Executables

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [how-its-going]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # tkinter for the GUI; python3-dev so libpff-python can
          # source-build against system Python headers; autotools
          # so the source build itself can run.
          sudo apt-get install -y python3-tk tk-dev python3-dev
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS-latest runners ship untrusted taps (aws/tap, azure/bicep)
          # that aren't needed for this build.  Skip the verbose
          # "tap not trusted" warnings so the install log stays focused.
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install python-tk

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps already include libpff-python and statsmodels
          # (see pyproject.toml), so the binary ships with PST scanning
          # and Holt-Winters forecasting built-in.  Build extra adds
          # PyInstaller on top.
          pip install -e ".[build]"

      - name: Build Executable
        shell: bash
        run: |
          # Hidden imports — each line below is a module the source
          # code loads dynamically (via ``find_spec`` / ``importlib``)
          # that PyInstaller's static analysis can't follow.  Every
          # entry here corresponds to a runtime dep declared in
          # ``pyproject.toml[project].dependencies``; we add it here
          # purely so PyInstaller bundles the binary into the exe.
          #
          # Crashes caused by a missing module show up at exe runtime
          # as ``ImportError: No module named 'X'`` — pinning these
          # with ``--hidden-import`` is the standard PyInstaller
          # workaround (see scikit-build / pandas' own bundling docs).
          #
          # NOTE: bash's ``\`` line-continuation does NOT accept ``#``
          # comments on the joined lines — the inline-comment
          # style the previous draft of this step used (mid-command
          # ``# === Direct deps: reportlab ===`` etc.) caused the
          # GitHub Actions runner to treat each comment as a fresh
          # shell command (``--hidden-import=reportlab: command
          # not found``), which propagates onward as
          # ``pyinstaller: error: the following arguments are
          # required: scriptname``.  All rationale lives in this
          # header block; the actual pyinstaller command is a clean
          # uninterrupted chain of ``\` joins.
          pyinstaller --onefile --windowed --name EDF_Evidence_Collector \
            --hidden-import=reportlab \
            --hidden-import=reportlab.platypus \
            --hidden-import=reportlab.lib \
            --hidden-import=reportlab.lib.colors \
            --hidden-import=reportlab.lib.styles \
            --hidden-import=reportlab.lib.units \
            --hidden-import=reportlab.lib.pagesizes \
            --hidden-import=reportlab.lib.enums \
            --hidden-import=reportlab.pdfbase \
            --hidden-import=reportlab.pdfbase.pdfmetrics \
            --hidden-import=reportlab.pdfbase.ttfonts \
            --hidden-import=scipy \
            --hidden-import=scipy.stats \
            --hidden-import=statsmodels \
            --hidden-import=statsmodels.tsa.holtwinters \
            --hidden-import=pypff \
            main.py

      - name: Code-sign macOS bundle (ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Ad-hoc signing (sign with `-` identity = no developer cert).
          # This won't pass Gatekeeper's notarization check, but it DOES
          # fix the "damaged" error caused by the unsigned bundle's
          # symlink/structure being mangled by zip compression during
          # artifact upload. Users who download the artifact will need
          # to `xattr -cr EDF_Evidence_Collector.app` to clear the
          # quarantine flag before running.
          if [ -d "dist/EDF_Evidence_Collector.app" ]; then
            codesign --force --deep --sign - dist/EDF_Evidence_Collector.app
            echo "Ad-hoc signed dist/EDF_Evidence_Collector.app"
          elif [ -f "dist/EDF_Evidence_Collector" ]; then
            codesign --force --sign - dist/EDF_Evidence_Collector
            echo "Ad-hoc signed dist/EDF_Evidence_Collector (single binary)"
          else
            echo "WARNING: No executable found to sign"
          fi

      - name: Verify executable exists
        run: |
          if [ -d "dist" ]; then
            ls -la dist/
          else
            echo "ERROR: dist/ directory not found"
            exit 1
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDF_Evidence_Collector-${{ matrix.os }}
          path: dist/
          retention-days: 7