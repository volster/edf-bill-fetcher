name: CI

on:
  push:
    branches: [How-it-started, things-got-out-of-hand, how-its-going, feature/web-ui]
  workflow_call:
    outputs:
      validated_sha:
        description: Revision accepted by every required CI matrix leg
        value: ${{ jobs.validation.outputs.validated_sha }}
  pull_request:
    branches: [How-it-started, things-got-out-of-hand, how-its-going]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    # Git Bash is available on Windows too. Its -e/pipefail behavior prevents
    # a later successful command from hiding a pip/tool installation failure.
    shell: bash

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1

      # Use the same CPython distribution for tests and executable builds.
      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt

      - name: Record Python runtime
        run: >-
          "${{ steps.python.outputs.python-path }}" ci_runtime.py --inventory --report .ci-diagnostics/python.json

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Headers and autotools support libpff when no matching wheel exists.
          sudo apt-get install -y python3-dev tesseract-ocr tesseract-ocr-eng
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          # autotools for libpff-python source build when no wheel
          # matches the macOS runner architecture / Python version.
          brew install autoconf automake libtool pkg-config

      - name: Install OCR engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Tesseract installation failed" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/ci-constraints.txt -e ".[dev,msg,web]"
          python -m pip freeze --all > .ci-diagnostics/dependencies.txt

      - name: Run linting (ruff)
        run: |
          python -m ruff check .

      - name: Run formatting check (ruff)
        run: |
          python -m ruff format --check .

      - name: Run type checking (mypy)
        run: |
          python -m mypy .

      - name: Check GUI runtimes (Linux)
        if: runner.os == 'Linux'
        run: >-
          "${{ steps.python.outputs.python-path }}" ci_runtime.py

      - name: Check GUI runtimes (Windows / macOS)
        if: runner.os != 'Linux'
        run: >-
          "${{ steps.python.outputs.python-path }}" ci_runtime.py

      - name: Check desktop layout under native font metrics
        run: >-
          python -m pytest tests/test_qt_desktop.py::test_action_stays_visible_and_source_steps_adapt
          --no-cov -q --junitxml=.ci-diagnostics/layout.xml

      - name: Run tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: python ci_pytest.py

      - name: Run tests with coverage (Windows / macOS)
        if: runner.os != 'Linux'
        run: python ci_pytest.py

      - name: Require full coverage for critical integrity contracts
        run: >-
          python -m coverage report
          --include="edf_bill_fetcher/domain/money.py,edf_bill_fetcher/processors/financial.py,edf_bill_fetcher/processors/compensation.py,edf_bill_fetcher/processors/preparation.py,edf_bill_fetcher/processors/ledger_context.py,edf_bill_fetcher/processors/posting_identity.py,edf_bill_fetcher/processors/rebilling_ledger.py,edf_bill_fetcher/processors/claim_reconciliation.py,edf_bill_fetcher/application/record_review.py,edf_bill_fetcher/application/review_session.py,edf_bill_fetcher/io/persistence/*.py,edf_bill_fetcher/io/reporters/source_links.py,edf_bill_fetcher/io/writers/rebilling_ledger.py"
          --fail-under=100

      - name: Publish test failures in the job summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import html
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          results = Path("test-results.xml")
          if results.is_file():
              suites = ElementTree.parse(results).getroot()
              cases = list(suites.iter("testcase"))
              failures = [
                  (case, problem)
                  for case in cases
                  for problem in case
                  if problem.tag in {"failure", "error"}
              ]
              skipped = sum(case.find("skipped") is not None for case in cases)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(
                      f"### Test results\n\n{len(cases)} tests · "
                      f"{len(failures)} failures/errors · {skipped} skipped\n\n"
                  )
                  for case, problem in failures[:20]:
                      test_id = case.get("classname", "") + "::" + case.get("name", "")
                      name = html.escape(test_id)
                      detail = html.escape((problem.text or problem.get("message", ""))[:6000])
                      summary.write(f"<details><summary>{name}</summary><pre>{detail}</pre></details>\n\n")
                      annotation = test_id + ": " + problem.get("message", "Test failed")[:1200]
                      annotation = annotation.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print("::error title=Test failure::" + annotation)
                  if len(failures) > 20:
                      summary.write("Additional failures are listed in the pytest log.\n")
          PY

      - name: Upload test and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_attempt }}
          path: |
            .ci-diagnostics/
            test-results.xml
            coverage.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  web:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native processing prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng build-essential autoconf automake libtool pkg-config
      - name: Install application and browser dependencies
        run: |
          python -m pip install -c .github/ci-constraints.txt -e ".[dev,msg,web]"
          npm ci --prefix frontend
      - name: Verify generated API contracts and frontend
        working-directory: frontend
        run: |
          npm run generate
          git diff --exit-code -- src/generated.ts openapi.json
          npm run format:check
          npm run build
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise complete browser workflows
        working-directory: frontend
        env:
          EDF_BROWSER: ${{ matrix.browser }}
        run: npm test
      - name: Retain browser failure traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-${{ matrix.browser }}
          path: frontend/test-results/
          retention-days: 7

  container:
    name: Container (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build installable web image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: edf-web:test
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
      - name: Check native capabilities and bundled frontend
        run: >-
          docker run --rm --entrypoint python edf-web:test -c
          "from pathlib import Path; import edf_bill_fetcher.web.api as api; from edf_bill_fetcher.helpers.capabilities import diagnostic_report; report=diagnostic_report(); assert (Path(api.__file__).parent/'static/index.html').is_file(); assert all(c['available'] for c in report['capabilities'] if c['key'] != 'qt'), report"

      - name: Exercise installed HTTP, OCR and reviewed evidence publication
        run: >-
          docker run --rm --entrypoint python
          -v "$PWD/.github/scripts/check_web_container.py:/checks/check_web_container.py:ro"
          -v "$PWD/tests/fixtures/scanned_bill.pdf:/checks/scanned_bill.pdf:ro"
          edf-web:test /checks/check_web_container.py

  validation:
    name: Required validation
    needs: [test, web, container]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      validated_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Require every matrix leg to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
          WEB_RESULT: ${{ needs.web.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$MATRIX_RESULT" = success && test "$WEB_RESULT" = success && test "$CONTAINER_RESULT" = success
      - name: Record validated revision
        id: revision
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: echo "sha=$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
