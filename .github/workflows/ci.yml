name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # GHA ubuntu-latest runners ship Python 3.12 as the default
          # interpreter; the matrix uses actions/setup-python to swap
          # in 3.10 / 3.11 / 3.12 but those interpreters are pulled
          # from python-build-standalone tarballs, not the system
          # apt repository.  Stripping the python*-dev install down
          # to just ``python3-dev`` (default interpreter headers)
          # is enough for the libpff-python source build, since the
          # extension compiles against the active interpreter's
          # headers regardless — pip locates python.h from
          # sysconfig.
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev
          sudo apt-get install -y python3-dev
          # autotools toolchain so libpff-python can source-build
          # when no Linux wheel matches the matrix's Python version.
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting (ruff)
        run: |
          ruff check .

      - name: Run formatting check (ruff)
        run: |
          ruff format --check .

      - name: Run type checking (mypy)
        run: |
          mypy .

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Trigger build workflow on success
        if: success() && github.ref == 'refs/heads/dev' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'matrix_build.yml',
              ref: 'dev'
            });