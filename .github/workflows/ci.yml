name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # tkinter for the GUI; python3-dev so libpff-python can
          # source-build against system Python headers; autotools
          # so the source build itself can run.
          sudo apt-get install -y python3-tk tk-dev python3-dev
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS-latest runners ship untrusted taps (aws/tap, azure/bicep)
          # that aren't needed for this build.  Skip the verbose
          # "tap not trusted" warnings so the install log stays focused.
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install python-tk
          # autotools for libpff-python source build when no wheel
          # matches the macOS runner architecture / Python version.
          brew install autoconf automake libtool pkg-config

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # Ensure the Python headers are present for any source build.
          # The official python.org Windows installer places headers in
          # include/, which pip finds via sysconfig.  MSVC is also
          # available on windows-latest for the MSVC build path.
          echo "Windows system deps: using default python.org headers + MSVC."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"
          mypy --version

      - name: Run linting (ruff)
        run: |
          ruff check .

      - name: Run formatting check (ruff)
        run: |
          ruff format --check .

      - name: Run type checking (mypy)
        run: |
          mypy .

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Trigger build workflow on success
        if: success() && github.ref == 'refs/heads/dev' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'matrix_build.yml',
              ref: 'dev'
            });