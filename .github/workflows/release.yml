name: Release

on:
  push:
    tags:
      # Minor releases (0.1.0, 0.2.0, ...) trigger a full build +
      # GitHub Release. Patch tags (0.0.X) skip this workflow —
      # they're handled by ci.yml's test-only tag trigger.
      - '0.*.0'
    branches: [how-its-going]

jobs:
  build:
    name: Build release executables (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev python3-dev
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install python-tk
          brew install autoconf automake libtool pkg-config

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build Executable
        shell: bash
        run: |
          # PyInstaller flags mirror matrix_build.yml. Hidden imports
          # are required because PyInstaller's static analysis can't
          # follow dynamic (find_spec/importlib) imports — see the
          # docstring in matrix_build.yml for the full rationale.
          pyinstaller --onefile --windowed --name EDF_Evidence_Collector \
            --hidden-import=reportlab \
            --hidden-import=reportlab.platypus \
            --hidden-import=reportlab.lib \
            --hidden-import=reportlab.lib.colors \
            --hidden-import=reportlab.lib.styles \
            --hidden-import=reportlab.lib.units \
            --hidden-import=reportlab.lib.pagesizes \
            --hidden-import=reportlab.lib.enums \
            --hidden-import=reportlab.pdfbase \
            --hidden-import=reportlab.pdfbase.pdfmetrics \
            --hidden-import=reportlab.pdfbase.ttfonts \
            --hidden-import=scipy \
            --hidden-import=scipy.stats \
            --hidden-import=statsmodels \
            --hidden-import=statsmodels.tsa.holtwinters \
            --hidden-import=pypff \
            main.py

      - name: Verify executable exists
        run: |
          if [ -d "dist" ]; then
            ls -la dist/
          else
            echo "ERROR: dist/ directory not found"
            exit 1
          fi
        shell: bash

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: EDF_Evidence_Collector-${{ matrix.os }}
          path: dist/
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/EDF_Evidence_Collector*
