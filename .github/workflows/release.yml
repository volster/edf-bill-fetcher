name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

env:
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: bash

jobs:
  validation:
    name: Validate tagged revision
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build release executables (${{ matrix.os }})
    needs: validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.validation.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ needs.validation.outputs.validated_sha }}

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt

      - name: Record Python runtime
        run: >-
          "${{ steps.python.outputs.python-path }}" ci_runtime.py --inventory --report .ci-diagnostics/python.json

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev python3-dev tesseract-ocr tesseract-ocr-eng
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 xvfb

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          brew install autoconf automake libtool pkg-config

      - name: Install OCR engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Tesseract installation failed" }

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/ci-constraints.txt -e ".[build,msg]"
          python -m pip freeze --all > .ci-diagnostics/dependencies.txt

      - name: Check GUI runtimes (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a "${{ steps.python.outputs.python-path }}" ci_runtime.py

      - name: Check GUI runtimes (Windows / macOS)
        if: runner.os != 'Linux'
        run: >-
          "${{ steps.python.outputs.python-path }}" ci_runtime.py

      - name: Build executable (standard .app on macOS)
        run: python ci_build.py

      - name: Verify bundled OCR and Excel corrections on an image-only bill
        if: runner.os != 'macOS'
        run: python .github/scripts/check_frozen_ocr.py

      - name: Record build dependencies
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.validation.outputs.validated_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          python -m pip freeze --all > dist/build-dependencies.txt
          python -c 'import json, os; json.dump({"sha": os.environ["VALIDATED_SHA"], "validation": "required-ci-passed"}, open("dist/build-provenance.json", "w"))'

      - name: Verify executable exists
        run: |
          if [ -d "dist" ]; then
            ls -la dist/
          else
            echo "ERROR: dist/ directory not found"
            exit 1
          fi
        shell: bash

      - name: Package release zip
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            python ci_macos.py --archive "EDF_Evidence_Collector-macos-arm64-ad-hoc-${RELEASE_TAG}.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path dist/EDF_Evidence_Collector.exe,dist/build-dependencies.txt,dist/build-provenance.json -DestinationPath 'EDF_Evidence_Collector-windows-${RELEASE_TAG}.zip' -Force"
          else
            zip -q "EDF_Evidence_Collector-ubuntu-${RELEASE_TAG}.zip" dist/EDF_Evidence_Collector dist/build-dependencies.txt dist/build-provenance.json
          fi
          ls -la ./*.zip

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .ci-diagnostics/
            build/EDF_Evidence_Collector/warn-*.txt
            build/EDF_Evidence_Collector/xref-*.html
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: EDF_Evidence_Collector-${{ matrix.os }}
          path: ./*.zip
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: [validation, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: EDF_Evidence_Collector-*
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
