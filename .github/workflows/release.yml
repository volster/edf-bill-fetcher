name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

env:
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    shell: bash

jobs:
  validation:
    name: Validate tagged revision
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build release executables (${{ matrix.os }})
    needs: validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.validation.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ needs.validation.outputs.validated_sha }}

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt

      - name: Record Python runtime
        run: >-
          "${{ steps.python.outputs.python-path }}" ci_runtime.py --inventory --report .ci-diagnostics/python.json

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev python3-dev tesseract-ocr tesseract-ocr-eng
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 xvfb

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          brew install autoconf automake libtool pkg-config

      - name: Install OCR engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Tesseract installation failed" }

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/ci-constraints.txt -e ".[build,msg]"
          python -m pip freeze --all > .ci-diagnostics/dependencies.txt

      - name: Check GUI runtimes (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a "${{ steps.python.outputs.python-path }}" ci_runtime.py

      - name: Check GUI runtimes (Windows / macOS)
        if: runner.os != 'Linux'
        run: >-
          "${{ steps.python.outputs.python-path }}" ci_runtime.py

      - name: Build Executable
        shell: bash
        run: |
          # PyInstaller flags mirror matrix_build.yml. Hidden imports
          # are required because PyInstaller's static analysis can't
          # follow dynamic (find_spec/importlib) imports — see the
          # docstring in matrix_build.yml for the full rationale.
          python -m PyInstaller --onefile --windowed --name EDF_Evidence_Collector \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --hidden-import=pypdfium2 \
            --additional-hooks-dir=.github/pyinstaller_hooks \
            --hidden-import=reportlab \
            --hidden-import=reportlab.platypus \
            --hidden-import=reportlab.lib \
            --hidden-import=reportlab.lib.colors \
            --hidden-import=reportlab.lib.styles \
            --hidden-import=reportlab.lib.units \
            --hidden-import=reportlab.lib.pagesizes \
            --hidden-import=reportlab.lib.enums \
            --hidden-import=reportlab.pdfbase \
            --hidden-import=reportlab.pdfbase.pdfmetrics \
            --hidden-import=reportlab.pdfbase.ttfonts \
            --hidden-import=scipy \
            --hidden-import=scipy.stats \
            --hidden-import=statsmodels \
            --hidden-import=statsmodels.tsa.holtwinters \
            --hidden-import=pypff \
            --collect-all extract_msg \
            --collect-data edf_bill_fetcher \
            --copy-metadata=edf-bill-fetcher \
            main.py

      - name: Code-sign macOS bundle (ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Ad-hoc signing (sign with `-` identity = no developer cert).
          # This won't pass Gatekeeper's notarization check. Users who
          # download the artifact will need
          # to `xattr -cr EDF_Evidence_Collector.app` to clear the
          # quarantine flag before running.
          #
          # --deep is deprecated since macOS 11 and can corrupt nested
          # framework signatures, so sign the inner binary first, then
          # the outer .app.
          if [ -d "dist/EDF_Evidence_Collector.app" ]; then
            codesign --force --sign - dist/EDF_Evidence_Collector.app/Contents/MacOS/EDF_Evidence_Collector || true
            codesign --force --sign - dist/EDF_Evidence_Collector.app || true
            echo "Ad-hoc signed dist/EDF_Evidence_Collector.app"
          elif [ -f "dist/EDF_Evidence_Collector" ]; then
            codesign --force --sign - dist/EDF_Evidence_Collector
            echo "Ad-hoc signed dist/EDF_Evidence_Collector (single binary)"
          else
            echo "WARNING: No executable found to sign"
          fi

      - name: Verify macOS code signature (ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "dist/EDF_Evidence_Collector.app" ]; then
            codesign --verify --verbose=4 dist/EDF_Evidence_Collector.app
            echo "Signature verification passed for dist/EDF_Evidence_Collector.app"
          elif [ -f "dist/EDF_Evidence_Collector" ]; then
            codesign --verify --verbose=4 dist/EDF_Evidence_Collector
            echo "Signature verification passed for dist/EDF_Evidence_Collector (single binary)"
          else
            echo "WARNING: No signed executable found to verify"
          fi

      - name: Verify bundled OCR and Excel corrections on an image-only bill
        run: python .github/scripts/check_frozen_ocr.py

      - name: Record build dependencies
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.validation.outputs.validated_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          python -m pip freeze --all > dist/build-dependencies.txt
          python -c 'import json, os; json.dump({"sha": os.environ["VALIDATED_SHA"], "validation": "required-ci-passed"}, open("dist/build-provenance.json", "w"))'

      - name: Verify executable exists
        run: |
          if [ -d "dist" ]; then
            ls -la dist/
          else
            echo "ERROR: dist/ directory not found"
            exit 1
          fi
        shell: bash

      - name: Package release zip
        shell: bash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          if [ -d "dist/EDF_Evidence_Collector.app" ]; then
            # macOS: zip the whole .app bundle (preserves symlinks so the
            # ad-hoc signature survives) plus the raw binary.
            zip -q -r -y "EDF_Evidence_Collector-macos-${TAG}.zip" \
              dist/EDF_Evidence_Collector.app dist/EDF_Evidence_Collector dist/build-dependencies.txt dist/build-provenance.json
            # Validate the bundle users will actually extract, after
            # packaging, rather than only the original build tree.
            archive_check="$(mktemp -d)"
            trap 'rm -rf "$archive_check"' EXIT
            unzip -q "EDF_Evidence_Collector-macos-${TAG}.zip" -d "$archive_check"
            codesign --verify --verbose=4 "$archive_check/dist/EDF_Evidence_Collector.app"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # Windows: PowerShell Compress-Archive to avoid zip quirks.
            powershell -Command "Compress-Archive -Path dist/EDF_Evidence_Collector.exe,dist/build-dependencies.txt,dist/build-provenance.json -DestinationPath 'EDF_Evidence_Collector-windows-${TAG}.zip' -Force"
          else
            zip -q "EDF_Evidence_Collector-ubuntu-${TAG}.zip" dist/EDF_Evidence_Collector dist/build-dependencies.txt dist/build-provenance.json
          fi
          ls -la ./*.zip

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            .ci-diagnostics/
            build/EDF_Evidence_Collector/warn-*.txt
            build/EDF_Evidence_Collector/xref-*.html
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: EDF_Evidence_Collector-${{ matrix.os }}
          path: |
            dist/
            ./*.zip
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: [validation, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: EDF_Evidence_Collector-*
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
