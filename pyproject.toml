[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edf-bill-fetcher"
version = "0.1.0"
description = "EDF Energy billing evidence collector for dispute resolution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "volster", email = "volster@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    # === Runtime core (required for any functional report — Excel + PDF + DOCX) ===
    "pandas>=2.0,<3",
    "pdfplumber>=0.10,<1",
    "beautifulsoup4>=4.12,<5",
    "openpyxl>=3.1,<4",
    "numpy>=1.24,<2",           # Pin <2 — see scipy pin below; numpy-2 stubs require PEP-695 mypy parses.
    "reportlab>=4.5,<5",        # PDF report generation
    "python-docx>=1.1,<2",      # DOCX report generation
    "scipy>=1.10,<1.15",        # rolling stats, normality tests, linregress
    # NOTE: scipy<1.15 deliberately keeps numpy pinned to <2.0.  numpy-2.x
    # ships PEP 695 type-alias stubs that mypy 1.x cannot parse when
    # configured for Python 3.10, breaking the ``mypy .`` step on every
    # CI matrix cell.  scipy 1.14.x is the last release that compiles
    # against numpy 1.x, so the bound holds both testing and runtime.
    #
    # libpff-python and statsmodels are core runtime deps.  PST/OST
    # ingestion goes through ``process_pst_file``/``process_ost_file``;
    # the Holt-Winters forecast pipeline lives in ``edf_report.py``.
    # Both are guarded by try/except at use sites so a missing package
    # still produces a runnable — though degraded — installation.
    # libpff-python is in [dependencies] (not an extra) because PST/OST
    # scanning is a documented, supported feature of the project.  The
    # pair (libpff-python + statsmodels) covers the "core install"
    # surfaces: ``process_pst_file`` reads Outlook archives and
    # ``edf_report.py`` runs Holt-Winters forecasts for kWh totals.
    # Use-sites wrap both in try/except so a missing build product
    # degrades gracefully rather than aborting startup.
    #
    # pip picks the platform wheel when one exists (Py 3.12 Windows,
    # Py 3.12 macOS) and falls back to the source sdist otherwise.
    "libpff-python>=20211114",  # Outlook PST/OST archive parsing
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0,<7",
]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1,<5",
    "pytest-xvfb>=3.0",  # headless X server for tkinter tests on Linux CI
    "coverage>=7.0",
    "ruff>=0.4,<1",
    "mypy>=1.9",
    "types-beautifulsoup4>=4.12,<5",
]

[project.urls]
Homepage = "https://github.com/volster/edf-bill-fetcher"
Repository = "https://github.com/volster/edf-bill-fetcher"
Issues = "https://github.com/volster/edf-bill-fetcher/issues"

[project.scripts]
edf-collector = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
# pytest-xvfb auto-activates on headless Linux. Larger size gives headroom
# under parallel test runs (spec risk #3 mitigation).
xvfb_width = 1280
xvfb_height = 1024
xvfb_colordepth = 24
# Upstream library warnings that are not bugs in our code:
# - statsmodels ValueWarning/FutureWarning: the chart + forecast tests feed
#   DataFrames that lack a date-frequency index, which statsmodels warns
#   about but continues to handle correctly (our forecast code passes the
#   data through; we do not rely on the index frequency).
# - statsmodels FutureWarning (No supported index is available): same
#   root cause; the predicted index will fall back to an integer range.
filterwarnings = [
    "ignore::statsmodels.tools.sm_exceptions.ValueWarning",
    "ignore::FutureWarning:statsmodels",
    "ignore:No supported index is available:FutureWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP 8)
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PT",  # flake8-pytest-style (test files only)
    "T20", # flake8-print (test files only)
    "D",   # pydocstyle (PEP 257 — docstring conventions)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args (intentional in some cases)
    "D203",  # one-blank-line-before-class  (conflicts with D211 — we use no-blank-line)
    "D213",  # multi-line-summary-second-line  (conflicts with D212 — we use first-line)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "PT011", "PT012", "D", "S101"]  # tests don't require docstrings (D); S101 allows asserts
"edf_bill_fetcher/io/cli.py" = ["T201"]
"edf_bill_fetcher/writers/__init__.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

# ``build/`` is a transient PyInstaller output directory emitted by
# ``pyinstaller --onefile ... main.py`` runs (locally and
# on the *Build Executables* CI worker).  Without an explicit
# exclude, mypy picks up ``build/lib/tests/__init__.py`` *and*
# ``tests/__init__.py`` and errors out with ``Duplicate module
# named 'tests'`` — pinning this in CI keeps the type-check gate
# robust regardless of when someone last ran the exe builder.
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pdfplumber",
    "bs4",
    "openpyxl",
    "numpy",
    "pypff",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["edf_bill_fetcher"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*.spec",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
# Coverage gate restored to 90% (Task 4.1): all Wave 2-4 targets landed,
# global coverage measured at 92% (baseline 73.44%). The gate catches
# future regressions against the completed coverage campaign.
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
