[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edf-bill-fetcher"
version = "0.1.0"
description = "EDF Energy billing evidence collector for dispute resolution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "volster", email = "volster@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    # === Runtime core (required for any functional report — Excel + PDF + DOCX) ===
    "pandas>=2.0,<3",
    "pdfplumber>=0.10,<1",
    "beautifulsoup4>=4.12,<5",
    "openpyxl>=3.1,<4",
    "numpy>=1.24,<2",           # Pin <2 — see scipy pin below; numpy-2 stubs require PEP-695 mypy parses.
    "reportlab>=4.5,<5",        # PDF report generation
    "python-docx>=1.1,<2",      # DOCX report generation
    "scipy>=1.10,<1.15",        # rolling stats, normality tests, linregress
    # NOTE: scipy<1.15 deliberately keeps numpy pinned to <2.0.  numpy-2.x
    # ships PEP 695 type-alias stubs that mypy 1.x cannot parse when
    # configured for Python 3.10, breaking the ``mypy .`` step on every
    # CI matrix cell.  scipy 1.14.x is the last release that compiles
    # against numpy 1.x, so the bound holds both testing and runtime.
    #
    # libpff-python and statsmodels are core runtime deps.  PST/OST
    # ingestion goes through ``process_pst_file``/``process_ost_file``;
    # the Holt-Winters forecast pipeline lives in ``edf_report.py``.
    # Both are guarded by try/except at use sites so a missing package
    # still produces a runnable — though degraded — installation.
    # libpff-python 20211114 is the last release with Windows x86 wheels
    # (cp39); newer builds only ship macosx wheels and force a from-
    # source compile via autotools on Linux/Windows.  Pinning <2024 keeps
    # the wheel-available path on Windows during the Windows CI matrix
    # cell while still allowing source build as a fallback.
    #
    # PYP 3.12 removed PyUnicode_AsUnicode, so libpff-python cannot be
    # compiled from source on Py 3.12 at all (any OS).  We gate it with
    # a python_version marker: installed on 3.10/3.11 (source-build
    # path still works), skipped on 3.12 (code has HAS_PYPFF=False guard).
    "libpff-python>=20211114,<2024; python_version < '3.12'",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0,<7",
]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1,<5",
    "ruff>=0.4,<1",
    "mypy>=1.9",
    "types-beautifulsoup4>=4.12,<5",
]

[project.urls]
Homepage = "https://github.com/volster/edf-bill-fetcher"
Repository = "https://github.com/volster/edf-bill-fetcher"
Issues = "https://github.com/volster/edf-bill-fetcher/issues"

[project.scripts]
edf-collector = "edf_collector:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PT",  # flake8-pytest-style (test files only)
    "T20", # flake8-print (test files only)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args (intentional in some cases)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "PT011", "PT012"]
"edf_collector.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pdfplumber",
    "bs4",
    "openpyxl",
    "numpy",
    "pypff",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*.spec",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
