[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edf-bill-fetcher"
version = "0.1.0"
description = "EDF Energy billing evidence collector for dispute resolution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "volster", email = "volster@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    # === Runtime core (required for any functional report — Excel + PDF + DOCX) ===
    "pandas>=2.0,<3",
    "pdfplumber>=0.10,<1",
    "beautifulsoup4>=4.12,<5",
    "openpyxl>=3.1,<4",
    "numpy>=1.24,<3",
    "reportlab>=4.5,<5",        # PDF report generation
    "python-docx>=1.1,<2",      # DOCX report generation
    "scipy>=1.10,<2",           # rolling stats, normality tests, linregress
]

[project.optional-dependencies]
# Optional deps that install only the heavy / platform-specific bits.
pst = ["libpff-python>=20211114"]            # Outlook PST/OST archive parsing
statsmodels = ["statsmodels>=0.14,<1"]       # Holt-Winters forecasting (otherwise EMA-only)
build = [
    "pyinstaller>=6.0,<7",
]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1,<5",
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
    "types-beautifulsoup4>=4.12,<5",
]

[project.urls]
Homepage = "https://github.com/volster/edf-bill-fetcher"
Repository = "https://github.com/volster/edf-bill-fetcher"
Issues = "https://github.com/volster/edf-bill-fetcher/issues"

[project.scripts]
edf-collector = "edf_collector:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PT",  # flake8-pytest-style (test files only)
    "T20", # flake8-print (test files only)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args (intentional in some cases)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "PT011", "PT012"]
"edf_collector.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pdfplumber",
    "bs4",
    "openpyxl",
    "numpy",
    "pypff",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*.spec",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
